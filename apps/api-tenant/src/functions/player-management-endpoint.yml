list-players:
  handler: src/handlers/list-players.handler
  events:
    - httpApi:
        path: /tenant/players
        method: get

get-player-detail:
  handler: src/handlers/get-player-detail.handler
  events:
    - httpApi:
        path: /tenant/players/{playerId}
        method: get

suspend-player:
  handler: src/handlers/suspend-player.handler
  events:
    - httpApi:
        path: /tenant/players/{playerId}/status
        method: patch
