player-login:
  handler: src/handlers/player-login.handler
  environment:
    COGNITO_PLAYER_POOL_ID: ${env:COGNITO_PLAYER_POOL_ID}
    COGNITO_PLAYER_POOL_CLIENT_ID: ${env:COGNITO_PLAYER_POOL_CLIENT_ID}
    PLAYER_PASSWORD_SECRET: ${env:PLAYER_PASSWORD_SECRET}
  events:
    - httpApi:
        path: /player/login
        method: post
