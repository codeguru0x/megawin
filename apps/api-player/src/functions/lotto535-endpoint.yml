# Lotto 5/35 – Player endpoints

lotto535-get-current-draw:
  handler: src/handlers/lotto535/get-current-draw.handler
  events:
    - httpApi:
        path: /player/lotto535/draws/current
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-jackpot:
  handler: src/handlers/lotto535/get-jackpot.handler
  events:
    - httpApi:
        path: /player/lotto535/jackpot
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-list-pending-tickets:
  handler: src/handlers/lotto535/list-pending-tickets.handler
  events:
    - httpApi:
        path: /player/lotto535/tickets/pending
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-list-completed-tickets:
  handler: src/handlers/lotto535/list-completed-tickets.handler
  events:
    - httpApi:
        path: /player/lotto535/tickets/completed
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-ticket-entries:
  handler: src/handlers/lotto535/get-ticket-entries.handler
  events:
    - httpApi:
        path: /player/lotto535/tickets/{ticketId}/entries
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-place-bet:
  handler: src/handlers/lotto535/place-bet.handler
  events:
    - httpApi:
        path: /player/lotto535/bets
        method: post
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-entry-lines:
  handler: src/handlers/lotto535/get-entry-lines.handler
  events:
    - httpApi:
        path: /player/lotto535/entries/{entryId}/lines
        method: get
        authorizer:
          name: cognitoPlayerAuth
