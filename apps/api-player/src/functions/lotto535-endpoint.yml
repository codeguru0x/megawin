lotto535-place-bet:
  handler: src/handlers/lotto535/place-bet.handler
  events:
    - httpApi:
        path: /games/lotto535/bets
        method: post
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-entry-lines:
  handler: src/handlers/lotto535/get-entry-lines.handler
