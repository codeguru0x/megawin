# Lotto 5/35 – Player endpoints

lotto535-get-game-config:
  handler: src/handlers/lotto535/get-game-config.handler
  events:
    - httpApi:
        path: /games/lotto535/config
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-current-draw:
  handler: src/handlers/lotto535/get-current-draw.handler
  events:
    - httpApi:
        path: /games/lotto535/draws/current
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-jackpot:
  handler: src/handlers/lotto535/get-jackpot.handler
  events:
    - httpApi:
        path: /games/lotto535/jackpot
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-list-pending-tickets:
  handler: src/handlers/lotto535/list-pending-tickets.handler
  events:
    - httpApi:
        path: /games/lotto535/tickets/pending
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-list-tickets:
  handler: src/handlers/lotto535/list-tickets.handler
  events:
    - httpApi:
        path: /games/lotto535/tickets
        method: get
        authorizer:
          name: cognitoPlayerAuth

lotto535-get-ticket-entries:
