# Keno – Player endpoints

keno-get-game-config:
  handler: src/handlers/keno/get-game-config.handler
  events:
    - httpApi:
        path: /games/keno/config
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-current-draw:
  handler: src/handlers/keno/get-current-draw.handler
  events:
    - httpApi:
        path: /games/keno/draws/current
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-list-pending-tickets:
  handler: src/handlers/keno/list-pending-tickets.handler
  events:
    - httpApi:
        path: /games/keno/tickets/pending
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-list-tickets:
  handler: src/handlers/keno/list-tickets.handler
  events:
    - httpApi:
        path: /games/keno/tickets
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-ticket-entries:
  handler: src/handlers/keno/get-ticket-entries.handler
  events:
    - httpApi:
        path: /games/keno/tickets/{ticketId}/entries
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-place-bet:
  handler: src/handlers/keno/place-bet.handler
  events:
    - httpApi:
        path: /games/keno/bets
        method: post
        authorizer:
          name: cognitoPlayerAuth
