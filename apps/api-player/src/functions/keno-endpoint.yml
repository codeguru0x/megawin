# Keno – Player endpoints

keno-get-game-config:
  handler: src/handlers/keno/get-game-config.handler
  events:
    - httpApi:
        path: /games/keno/config
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-current-draw:
  handler: src/handlers/keno/get-current-draw.handler
  events:
    - httpApi:
        path: /games/keno/draws/current
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-list-pending-tickets:
  handler: src/handlers/keno/list-pending-tickets.handler
  events:
    - httpApi:
        path: /games/keno/tickets/pending
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-list-tickets:
  handler: src/handlers/keno/list-tickets.handler
  events:
    - httpApi:
        path: /games/keno/tickets
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-ticket-entries:
  handler: src/handlers/keno/get-ticket-entries.handler
  events:
    - httpApi:
        path: /games/keno/tickets/{ticketId}/entries
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-place-bet:
  handler: src/handlers/keno/place-bet.handler
  events:
    - httpApi:
        path: /games/keno/bets
        method: post
        authorizer:
          name: cognitoPlayerAuth

keno-list-draw-results:
  handler: src/handlers/keno/list-draw-results.handler
  events:
    - httpApi:
        path: /games/keno/draw-results
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-draw-result:
  handler: src/handlers/keno/get-draw-result.handler
  events:
    - httpApi:
        path: /games/keno/draw-results/{drawId}
        method: get
        authorizer:
          name: cognitoPlayerAuth

keno-get-combo-popularity:
  handler: src/handlers/keno/get-combo-popularity.handler
  events:
    - httpApi:
        path: /games/keno/draws/{drawId}/combo-popularity
        method: get
        authorizer:
          name: cognitoPlayerAuth
