# Bingo 18 – Player endpoints

bingo18-get-game-config:
  handler: src/handlers/bingo18/get-game-config.handler
  events:
    - httpApi:
        path: /games/bingo18/config
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-get-current-draw:
  handler: src/handlers/bingo18/get-current-draw.handler
  events:
    - httpApi:
        path: /games/bingo18/draws/current
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-list-pending-tickets:
  handler: src/handlers/bingo18/list-pending-tickets.handler
  events:
    - httpApi:
        path: /games/bingo18/tickets/pending
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-list-tickets:
  handler: src/handlers/bingo18/list-tickets.handler
  events:
    - httpApi:
        path: /games/bingo18/tickets
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-get-ticket-entries:
  handler: src/handlers/bingo18/get-ticket-entries.handler
  events:
    - httpApi:
        path: /games/bingo18/tickets/{ticketId}/entries
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-place-bet:
  handler: src/handlers/bingo18/place-bet.handler
  events:
    - httpApi:
        path: /games/bingo18/bets
        method: post
        authorizer:
          name: cognitoPlayerAuth

bingo18-list-draw-results:
  handler: src/handlers/bingo18/list-draw-results.handler
  events:
    - httpApi:
        path: /games/bingo18/draw-results
        method: get
        authorizer:
          name: cognitoPlayerAuth

bingo18-get-draw-result:
  handler: src/handlers/bingo18/get-draw-result.handler
  events:
    - httpApi:
        path: /games/bingo18/draw-results/{drawId}
        method: get
        authorizer:
          name: cognitoPlayerAuth
