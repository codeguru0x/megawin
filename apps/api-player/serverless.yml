service: megawin-player
app: megawin-player

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 4010
    lambdaPort: 4011
    noPrependStageInUrl: true
    ignoreJWTSignature: true

stages:
  dev:
    observability:
      provider: axiom
      dataset: dev-megawin-player
    params:
      ### Mặc định dev sẽ là 0 không cấu hình ở prod mà chỉ định luôn khi cấu hình func
      provisionedConcurrency: 0

  prod:
    observability:
      provider: axiom
      dataset: prod-megawin-player

  default:
    observability: false

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage, 'dev'}
  region: ap-southeast-1

  environment:
    STAGE: ${self:provider.stage}
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb://localhost:27017/megawin'}

  httpApi:
    cors:
      allowedOrigins:
        - ${env:CORS_ALLOWED_ORIGIN, '*'}
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-API-Key
      maxAge: 86400

    authorizers:
      cognitoPlayerAuth:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${env:COGNITO_ISSUER_URL}
        audience:
          - ${env:COGNITO_CLIENT_ID}

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  - ${file(src/functions/game-endpoint.yml)}
  - ${file(src/functions/balance-endpoint.yml)}
  - ${file(src/functions/lotto535-endpoint.yml)}
  - ${file(src/functions/keno-endpoint.yml)}
  - ${file(src/functions/power655-endpoint.yml)}
  - ${file(src/functions/mega645-endpoint.yml)}
  - ${file(src/functions/max3d-endpoint.yml)}
  - ${file(src/functions/max3dpro-endpoint.yml)}
  - ${file(src/functions/bingo18-endpoint.yml)}
