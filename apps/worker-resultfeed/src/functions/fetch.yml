fetch-vietlott-lotto535:
  handler: src/handlers/fetch/vietlott-lotto535.handler
  # Timeout giống các source khác — dù Lotto535 chỉ quay 2 kỳ/ngày, cron vẫn chạy mỗi
  # phút để bắt kịp NGAY khi site publish trễ hơn giờ quay lý thuyết (13:00/21:00).
  # `nextFetchAt` (schedule-aware, xem schedule.ts) mới là thứ quyết định tick nào thực
  # sự gọi fetch — các tick còn lại thoát sớm ở bước 1 use-case, gần như không tốn gì.
  timeout: 120
  events:
    - schedule:
        rate: cron(* * * * ? *)
        enabled: true

