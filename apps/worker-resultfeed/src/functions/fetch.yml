fetch-vietlott-keno:
  handler: src/handlers/fetch/vietlott-keno.handler
  # Timeout = ttlSeconds truyền vào FetchAndParseUseCase (lock TTL). 1 lượt fetch + parse
  # + vài DB write — dư giờ cho retry nội bộ của FetchProvider (xem http-client retry).
  timeout: 120
  events:
    - schedule:
        # Cron 1 phút — KHÔNG phải nhịp quay thật. `nextFetchAt` trong SourceCursor mới
        # là thứ điều khiển nhịp fetch thật (đọc + sửa qua data, không redeploy). Tick
        # không đến hạn thì thoát ngay ở bước 1 của use-case, gần như không tốn gì.
        # Xem 02-fetch-parse.plan.md §4.
        rate: cron(* * * * ? *)
        enabled: true

