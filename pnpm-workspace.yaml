packages:
  - apps/*
  - packages/*
  - tooling/*
  - "!**/test/**"

# `eve` ship `.d.ts` có `import * as z from "zod"` (mọi type suy ra bằng `z.infer`) nhưng KHÔNG khai
# báo zod ở `dependencies` lẫn `peerDependencies`. Zod chỉ resolve được nhờ hoisting → tuỳ layout
# `node_modules` từng máy. Nơi nào không resolve được thì `z` thành `any`, `skipLibCheck: true` che
# lỗi, và MỌI type zod-derived của eve âm thầm thành `any`. Hậu quả đã xảy ra thật (18/08/2026):
# `EveMessageInputRequest["kind"]` mất union → `switch` exhaustive trong
# `apps/backoffice/src/components/ai-chat/render-message.tsx` báo TS2366 làm đỏ build Vercel trong
# khi `check-types` local xanh. Khai báo zod thành dependency thật của eve để type resolve giống nhau
# ở mọi môi trường. Version bám theo zod của monorepo (`^4.4.3`) — đổi zod thì đổi luôn ở đây.
packageExtensions:
  eve:
    dependencies:
      zod: ^4.4.3

overrides:
  "@types/node": ^25.9.4
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3

allowBuilds:
  esbuild: true
  protobufjs: true
  core-js: false
  serverless: false
  sharp: false

minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.20"
  - "@better-auth/drizzle-adapter@1.6.20"
  - "@better-auth/kysely-adapter@1.6.20"
  - "@better-auth/memory-adapter@1.6.20"
  - "@better-auth/mongo-adapter@1.6.20"
  - "@better-auth/prisma-adapter@1.6.20"
  - "@better-auth/telemetry@1.6.20"
  - better-auth@1.6.20
  - react-hook-form@7.80.0
  - postcss@8.5.23
  - eve@0.38.3
