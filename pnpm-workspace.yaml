packages:
  - apps/*
  - packages/*
  - tooling/*
  - "!**/test/**"

# `eve` ship `.d.ts` có `import * as z from "zod"` (mọi type suy ra bằng `z.infer`) nhưng KHÔNG khai
# báo zod ở `dependencies` lẫn `peerDependencies`. Zod chỉ resolve được nhờ hoisting → tuỳ layout
# `node_modules` từng máy. Nơi nào không resolve được thì `z` thành `any`, `skipLibCheck: true` che
# lỗi, và MỌI type zod-derived của eve âm thầm thành `any`. Hậu quả đã xảy ra thật (18/08/2026):
# `EveMessageInputRequest["kind"]` mất union → `switch` exhaustive trong
# `apps/backoffice/src/components/ai-chat/render-message.tsx` báo TS2366 làm đỏ build Vercel trong
# khi `check-types` local xanh. Khai báo zod thành dependency thật của eve để type resolve giống nhau
# ở mọi môi trường. Version bám theo zod của monorepo (`^4.6.5`) — đổi zod thì đổi luôn ở đây.
packageExtensions:
  eve:
    dependencies:
      zod: ^4.6.5

overrides:
  "@types/node": ^25.9.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  # `next` khai `@playwright/test` là OPTIONAL peer chỉ để phục vụ `next/experimental/testmode`
  # — thứ không có trong `exports` của next@16.3.5 và repo không dùng (0 match). Cài
  # `@playwright/test` lẻ ở 1 package làm pnpm sinh instance `next` thứ 2 (peer set khác → hash
  # khác). `NextURL` vẫn còn `private [Internal]` (PR vercel/next.js#82172 chỉ bỏ brand của
  # `NextRequest`, chưa bỏ của `NextURL`) nên 2 instance không assignable → 798 lỗi type giữa
  # `packages/next` và `apps/backoffice`. Xoá peer để mọi package luôn dùng đúng 1 instance.
  # Chi tiết: `.cursor/plans/ui-visual-regression/p0-01-playwright-foundation.plan.md` §1.
  "next>@playwright/test": "-"

allowBuilds:
  esbuild: true
  protobufjs: true
  core-js: false
  serverless: false
  sharp: false
  cpu-features: true
  ssh2: true

# pnpm v11 mặc định `minimumReleaseAge: 1440` (24 giờ): không cài bản vừa publish
# trên npm cho đến khi đủ tuổi — giảm rủi ro supply-chain (malware thường bị phát hiện
# trong ~1 giờ). CỐ TÌNH không dùng `minimumReleaseAgeExclude`: kể cả package "uy tín"
# (axios, …) đã từng bị xâm nhập; ngoại lệ làm mất lớp bảo vệ đúng lúc cần nhất.
# Khi bump dep mới < 24 giờ tuổi mà install fail → chờ đủ tuổi, KHÔNG thêm exclude.
# Docs: https://pnpm.io/settings/dependency-resolution#minimumreleaseage
minimumReleaseAge: 1440
